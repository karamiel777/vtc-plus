<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>VTC PLUS · Suivi de flotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--card:#151517;--card2:#1c1c1f;--line:#2a2a2e;--text:#F2EFE8;--muted:#9a978f;--gold:#C9A45C;--gold2:#E4C382;--ok:#5fb37a;--warn:#e0a63c;--bad:#d9625a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:60px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:24px;color:var(--gold2)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:9px 14px}
button.gold{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
button.small{padding:6px 10px;font-size:13px}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.veh{cursor:pointer}.veh:hover{border-color:var(--gold)}
.veh h3{font-size:21px}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:3px 4px 0 0;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-bad{color:var(--bad);border-color:var(--bad)}.b-na{color:var(--muted);border-color:var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi div{background:var(--card2);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:20px;color:var(--gold2);font-family:'Cormorant Garamond',serif}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:360px;margin:12vh auto}
#err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}
.hide{display:none!important}
.del{color:var(--bad);background:none;border:0;padding:2px 6px}
</style>
</head>
<body>

<div id="loginView" class="wrap login hide">
  <h1 style="font-size:34px;color:var(--gold2)">VTC PLUS</h1>
  <p class="muted">Suivi de flotte — accès réservé à l'équipe</p>
  <div class="card">
    <label>Email<input id="email" type="email" autocomplete="username"></label>
    <label>Mot de passe<input id="pass" type="password" autocomplete="current-password"></label>
    <div id="err"></div>
    <button class="gold" style="width:100%;margin-top:6px" id="loginBtn">Se connecter</button>
  </div>
</div>

<div id="appView" class="hide">
  <header>
    <div><h1 id="title">Suivi de flotte</h1><div class="muted" id="who"></div></div>
    <div style="display:flex;gap:8px">
      <button class="small hide" id="backBtn">← Véhicules</button>
      <button class="small" id="outBtn">Déconnexion</button>
    </div>
  </header>
  <div class="wrap" id="main"></div>
</div>

<script type="module">
import { app, db } from "./firebase-config.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { collection, getDocs, getDoc, doc, addDoc, updateDoc, deleteDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAr = n => Number(n||0).toLocaleString('fr-FR') + ' Ar';
const fmtKm = n => Number(n||0).toLocaleString('fr-FR') + ' km';
const dDisp = iso => { if(!iso) return '—'; const p = String(iso).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; };
const today = () => new Date().toISOString().slice(0,10);
const MAINT_INTERVAL = 7000;

let isDirector = false, vehicles = [], currentId = null, tab = 'km', data = {km:[],maint:[],ins:[],fuel:[]};

/* ---------- connexion ---------- */
$('loginBtn').onclick = async () => {
  $('err').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
  catch(e){ $('err').textContent = 'Email ou mot de passe incorrect.'; }
};
$('pass').addEventListener('keydown', e => { if(e.key==='Enter') $('loginBtn').click(); });
$('outBtn').onclick = () => signOut(auth);
$('backBtn').onclick = () => { currentId = null; render(); };

onAuthStateChanged(auth, async user => {
  if(!user){ $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); return; }
  try { isDirector = (await getDoc(doc(db,'directors',user.uid))).exists(); } catch(e){ isDirector = false; }
  $('who').textContent = (isDirector ? 'Direction' : 'Gérante') + ' · ' + user.email;
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  await loadVehicles(); render();
});

async function loadVehicles(){
  const s = await getDocs(collection(db,'vehicles'));
  vehicles = s.docs.map(d => ({id:d.id, ...d.data()}));
  vehicles.sort((a,b) => (a.plate||'').localeCompare(b.plate||''));
}

async function loadVehicleData(id){
  const q = (c) => getDocs(query(collection(db,c), where('vehicleId','==',id)));
  const [k,e,i] = await Promise.all([q('vehicleKmLogs'), q('expenses'), q('vehicleInsurances')]);
  const byDate = (a,b) => (b.date||'').localeCompare(a.date||'');
  data.km = k.docs.map(d=>({id:d.id,...d.data()})).sort(byDate);
  const ex = e.docs.map(d=>({id:d.id,...d.data()}));
  data.maint = ex.filter(x=>x.category==='maintenance').sort(byDate);
  data.fuel = ex.filter(x=>x.category==='fuel').sort(byDate);
  data.ins = i.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.endDate||'').localeCompare(a.endDate||''));
}

/* ---------- calculs ---------- */
function currentKm(v, kmLogs){
  const m = Math.max(Number(v.km||0), ...(kmLogs||[]).map(l=>Number(l.km||0)), 0);
  return m;
}
function expiryBadge(label, iso){
  if(!iso) return `<span class="badge b-na">${label} : non renseignée</span>`;
  const days = Math.floor((new Date(iso+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000);
  if(days < 0) return `<span class="badge b-bad">${label} expirée (${dDisp(iso)})</span>`;
  if(days <= 30) return `<span class="badge b-warn">${label} : ${days} j (${dDisp(iso)})</span>`;
  return `<span class="badge b-ok">${label} OK · ${dDisp(iso)}</span>`;
}
function insuranceEnd(v, insList){
  const ends = (insList||[]).map(i=>i.endDate).filter(Boolean).sort();
  return ends.length ? ends[ends.length-1] : (v.insuranceExpiry || '');
}

/* ---------- affichage ---------- */
function render(){
  $('backBtn').classList.toggle('hide', !currentId);
  if(!currentId) return renderList();
  renderDetail();
}

function renderList(){
  $('title').textContent = 'Suivi de flotte';
  if(!vehicles.length){ $('main').innerHTML = '<div class="card muted">Aucun véhicule. Ajoute-les d\'abord dans l\'admin (onglet Flotte).</div>'; return; }
  $('main').innerHTML = '<div class="grid">' + vehicles.map(v => `
    <div class="card veh" data-id="${v.id}">
      <h3>${esc(v.brand)} ${esc(v.model)}</h3>
      <div class="muted">${esc(v.plate||'')} ${v.color? '· '+esc(v.color):''}</div>
      <div style="margin-top:8px"><b>${fmtKm(v.km)}</b> <span class="muted">(dernier km connu)</span></div>
      <div>${expiryBadge('Assurance', v.insuranceExpiry)}${expiryBadge('Visite', v.visiteExpiry)}${expiryBadge('Carte grise', v.carteGriseExpiry)}</div>
    </div>`).join('') + '</div>';
  document.querySelectorAll('.veh').forEach(el => el.onclick = async () => {
    currentId = el.dataset.id; tab = 'km'; $('main').innerHTML = '<p class="muted">Chargement…</p>';
    await loadVehicleData(currentId); render();
  });
}

function renderDetail(){
  const v = vehicles.find(x=>x.id===currentId); if(!v) { currentId=null; return render(); }
  $('title').textContent = (v.brand||'') + ' ' + (v.model||'');
  const km = currentKm(v, data.km);
  const nextKm = Number(v.lastMaintenanceKm||0) + MAINT_INTERVAL;
  const left = nextKm - km;
  const tabs = [['km','Kilométrage'],['maint','Entretiens'],['ins','Assurances']];
  if(isDirector) tabs.push(['cost','Coûts']);
  $('main').innerHTML = `
    <div class="card">
      <div class="muted">${esc(v.plate||'')} ${v.color?'· '+esc(v.color):''}</div>
      <div class="kpi" style="margin-top:10px">
        <div><span class="muted">Km actuel</span><b>${fmtKm(km)}</b></div>
        <div><span class="muted">Prochaine vidange</span><b>${fmtKm(nextKm)}</b><span class="muted">${left>=0? 'dans '+fmtKm(left) : 'dépassée de '+fmtKm(-left)}</span></div>
      </div>
      <div style="margin-top:6px">${expiryBadge('Assurance', insuranceEnd(v,data.ins))}${expiryBadge('Visite', v.visiteExpiry)}${expiryBadge('Carte grise', v.carteGriseExpiry)}</div>
    </div>
    <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <div id="pane"></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderDetail(); });
  ({km:paneKm, maint:paneMaint, ins:paneIns, cost:paneCost})[tab](v);
}

function delBtn(coll,id){ return isDirector ? `<button class="del" data-del="${coll}|${id}" title="Supprimer">✕</button>` : ''; }
function bindDel(){
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Supprimer cette ligne ?')) return;
    const [c,id] = b.dataset.del.split('|'); await deleteDoc(doc(db,c,id));
    await loadVehicleData(currentId); renderDetail();
  });
}

/* ----- Kilométrage ----- */
function paneKm(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouveau relevé</h3>
      <div class="two"><label>Date<input id="k-date" type="date" value="${today()}"></label>
      <label>Kilométrage<input id="k-km" type="number" inputmode="numeric" min="0"></label></div>
      <label>Relevé par<input id="k-by" placeholder="Nom de la personne"></label>
      <label>Note (facultatif)<input id="k-note"></label>
      <button class="gold" style="margin-top:12px" id="k-save">Enregistrer</button><div id="k-err" class="muted" style="color:var(--bad)"></div></div>
    <div class="card"><h3>Historique</h3>${data.km.length ? data.km.map(l=>`
      <div class="row"><div><b>${fmtKm(l.km)}</b><div class="muted">${dDisp(l.date)} · par ${esc(l.recordedBy||'—')}${l.note?' · '+esc(l.note):''}</div></div>${delBtn('vehicleKmLogs',l.id)}</div>`).join('') : '<p class="muted">Aucun relevé pour l\'instant.</p>'}</div>`;
  $('k-save').onclick = async () => {
    const km = Number($('k-km').value), date = $('k-date').value, by = $('k-by').value.trim();
    if(!km || !date || !by){ $('k-err').textContent = 'Date, km et nom sont obligatoires.'; return; }
    const prev = currentKm(v, data.km);
    if(km < prev && !confirm(`Ce km (${fmtKm(km)}) est inférieur au dernier connu (${fmtKm(prev)}). Enregistrer quand même ?`)) return;
    await addDoc(collection(db,'vehicleKmLogs'), {vehicleId:v.id, date, km, recordedBy:by, note:$('k-note').value.trim(), createdAt:serverTimestamp()});
    if(km > Number(v.km||0)){ await updateDoc(doc(db,'vehicles',v.id), {km}); v.km = km; }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Entretiens ----- */
function paneMaint(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouvel entretien</h3>
      <div class="two"><label>Date<input id="m-date" type="date" value="${today()}"></label>
      <label>Km au moment de l'entretien<input id="m-km" type="number" inputmode="numeric" value="${currentKm(v,data.km)||''}"></label></div>
      <label>Type (vidange, pneus, freins…)<input id="m-type"></label>
      <label>Fait par (personne ou garage)<input id="m-by" placeholder="Qui a fait l'entretien ?"></label>
      <label>Garage / lieu (facultatif)<input id="m-garage"></label>
      ${isDirector ? '<label>Montant (Ar)<input id="m-amount" type="number" inputmode="numeric" min="0"></label>' : ''}
      <label>Détails (facultatif)<textarea id="m-desc" rows="2"></textarea></label>
      <button class="gold" style="margin-top:12px" id="m-save">Enregistrer</button><div id="m-err" class="muted" style="color:var(--bad)"></div></div>
    <div class="card"><h3>Historique des entretiens</h3>${data.maint.length ? data.maint.map(m=>`
      <div class="row"><div><b>${esc(m.maintType||'Entretien')}</b> <span class="muted">· ${fmtKm(m.kmAtService)}</span>
      <div class="muted">${dDisp(m.date)} · fait par ${esc(m.performedBy||m.garage||'—')}${m.garage&&m.performedBy?' ('+esc(m.garage)+')':''}${m.description?' · '+esc(m.description):''}</div></div>
      <div style="text-align:right">${isDirector ? fmtAr(m.amount) : ''}${delBtn('expenses',m.id)}</div></div>`).join('') : '<p class="muted">Aucun entretien enregistré.</p>'}</div>`;
  $('m-save').onclick = async () => {
    const date=$('m-date').value, km=Number($('m-km').value), type=$('m-type').value.trim(), by=$('m-by').value.trim();
    if(!date || !km || !type || !by){ $('m-err').textContent = 'Date, km, type et « fait par » sont obligatoires.'; return; }
    await addDoc(collection(db,'expenses'), {vehicleId:v.id, category:'maintenance', date, kmAtService:km, maintType:type, performedBy:by,
      garage:$('m-garage').value.trim(), amount: isDirector ? Number($('m-amount').value||0) : 0, paymentMethod:'cash',
      description:$('m-desc').value.trim(), createdAt:serverTimestamp()});
    const upd = {}; if(km > Number(v.lastMaintenanceKm||0)) upd.lastMaintenanceKm = km; if(km > Number(v.km||0)) upd.km = km;
    if(Object.keys(upd).length){ await updateDoc(doc(db,'vehicles',v.id), upd); Object.assign(v, upd); }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Assurances ----- */
function paneIns(v){
  $('pane').innerHTML = `
    <div class="card"><h3>Nouveau contrat / renouvellement</h3>
      <label>Assureur<input id="i-co"></label>
      <label>N° de contrat<input id="i-no"></label>
      <div class="two"><label>Début<input id="i-start" type="date" value="${today()}"></label>
      <label>Fin<input id="i-end" type="date"></label></div>
      <label>Type de couverture (tous risques, tiers…)<input id="i-cov"></label>
      ${isDirector ? '<label>Prime payée (Ar)<input id="i-prem" type="number" inputmode="numeric" min="0"></label>' : ''}
      <label>Note (facultatif)<input id="i-note"></label>
      <button class="gold" style="margin-top:12px" id="i-save">Enregistrer</button><div id="i-err" class="muted" style="color:var(--bad)"></div></div>
    <div class="card"><h3>Historique des assurances</h3>${data.ins.length ? data.ins.map(i=>`
      <div class="row"><div><b>${esc(i.company||'—')}</b> <span class="muted">· contrat ${esc(i.policyNo||'—')}</span>
      <div class="muted">Du ${dDisp(i.startDate)} au ${dDisp(i.endDate)}${i.coverage?' · '+esc(i.coverage):''}${i.note?' · '+esc(i.note):''}</div></div>
      <div style="text-align:right">${isDirector ? fmtAr(i.premium) : ''}${delBtn('vehicleInsurances',i.id)}</div></div>`).join('') : '<p class="muted">Aucune assurance enregistrée.</p>'}</div>`;
  $('i-save').onclick = async () => {
    const co=$('i-co').value.trim(), start=$('i-start').value, end=$('i-end').value;
    if(!co || !start || !end){ $('i-err').textContent = 'Assureur, début et fin sont obligatoires.'; return; }
    if(end < start){ $('i-err').textContent = 'La date de fin est avant le début.'; return; }
    await addDoc(collection(db,'vehicleInsurances'), {vehicleId:v.id, company:co, policyNo:$('i-no').value.trim(), startDate:start, endDate:end,
      coverage:$('i-cov').value.trim(), premium: isDirector ? Number($('i-prem').value||0) : 0, note:$('i-note').value.trim(), createdAt:serverTimestamp()});
    if(end > (v.insuranceExpiry||'')){ await updateDoc(doc(db,'vehicles',v.id), {insuranceExpiry:end}); v.insuranceExpiry = end; }
    await loadVehicleData(v.id); renderDetail();
  };
  bindDel();
}

/* ----- Coûts (direction seulement) — pas de prix d'achat ----- */
function paneCost(v){
  if(!isDirector){ $('pane').innerHTML=''; return; }
  const sum = a => a.reduce((s,x)=>s+Number(x.amount ?? x.premium ?? 0),0);
  const fuel = sum(data.fuel), maint = sum(data.maint), ins = data.ins.reduce((s,i)=>s+Number(i.premium||0),0);
  const total = fuel+maint+ins;
  const kms = data.km.map(l=>Number(l.km)).filter(Boolean);
  const dist = kms.length>=2 ? Math.max(...kms)-Math.min(...kms) : 0;
  $('pane').innerHTML = `<div class="card"><h3>Coûts d'exploitation</h3>
    <p class="muted">Carburant + entretiens + primes d'assurance. Le prix d'achat n'est pas pris en compte.</p>
    <div class="kpi">
      <div><span class="muted">Carburant</span><b>${fmtAr(fuel)}</b></div>
      <div><span class="muted">Entretiens</span><b>${fmtAr(maint)}</b></div>
      <div><span class="muted">Assurances</span><b>${fmtAr(ins)}</b></div>
      <div><span class="muted">Total</span><b>${fmtAr(total)}</b></div>
      <div><span class="muted">Coût au km</span><b>${dist>0 ? fmtAr(Math.round(total/dist)) : '—'}</b><span class="muted">${dist>0 ? 'sur '+fmtKm(dist)+' relevés' : 'il faut au moins 2 relevés km'}</span></div>
    </div></div>`;
}
</script>
</body>
</html>
